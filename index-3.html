<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--g1:#ffeef5;--g2:#ffd0e3;--bar:#ffa8cb;--tray:#ffbdd6;--fg:#7a1f4d;--cell:rgba(255,105,160,.14);--line:rgba(214,70,130,.5)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--g1:#4a2035;--g2:#2e1424;--bar:#8f3a63;--tray:#6b2e50;--fg:#ffe3ef;--cell:rgba(255,160,200,.12);--line:rgba(255,160,200,.45)}}
:root[data-theme="dark"]{--g1:#4a2035;--g2:#2e1424;--bar:#8f3a63;--tray:#6b2e50;--fg:#ffe3ef;--cell:rgba(255,160,200,.12);--line:rgba(255,160,200,.45)}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;height:100%;display:flex;flex-direction:column;background:linear-gradient(var(--g1),var(--g2));color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none}
#top{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--bar);border-radius:0 0 22px 22px;box-shadow:0 3px 8px rgba(0,0,0,.25);flex:none}
#top h1{margin:0;font-size:15px;flex:1;white-space:nowrap;letter-spacing:.5px}
button,select{font:inherit;font-size:14px;border:0;border-radius:999px;padding:7px 12px;background:rgba(255,255,255,.9);color:#a3295f;cursor:pointer}
#cnt{background:rgba(255,255,255,.6);color:#a3295f;border-radius:999px;padding:6px 12px;font-size:14px;direction:ltr}
#wrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:6px}
#board{position:relative;background:rgba(255,255,255,.45);border-radius:6px;box-shadow:inset 0 2px 8px rgba(190,60,120,.25);direction:ltr}
.p{position:absolute;left:0;top:0;transform-origin:0 0;transform:scale(var(--k,1));touch-action:none;filter:drop-shadow(0 3px 4px rgba(0,0,0,.4));cursor:grab}
.p canvas{display:block;pointer-events:none}
.p.drag{position:fixed;transform:none;z-index:99;cursor:grabbing;filter:drop-shadow(0 8px 10px rgba(0,0,0,.5))}
.p.ok{transform:none;filter:none;z-index:1;cursor:default}
#lab{flex:none;align-self:flex-start;margin:0 12px;background:#ff7eb6;color:#fff;font-weight:700;font-size:13px;padding:3px 14px;border-radius:12px 12px 0 0}
#tray{flex:none;height:120px;background:var(--tray);display:flex;align-items:center;gap:10px;padding:0 10px;overflow-x:auto;overflow-y:hidden;direction:ltr;touch-action:pan-x;box-shadow:0 -3px 8px rgba(0,0,0,.25)}
.slot{position:relative;flex:none}
#win,#ghost{position:absolute;inset:0;display:none;z-index:50;border-radius:6px}
#ghost{background-size:100% 100%;z-index:60}
#win{flex-direction:column;align-items:center;justify-content:center;gap:10px;background:rgba(214,70,130,.8);color:#fff;letter-spacing:1px;font-size:26px;font-weight:800;text-align:center;animation:pop .5s}
#win span{font-size:60px}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}

const IMG=new Image();
let C=3,R=4,bw,bh,pw,ph,m,pad,placed=0,Hh,Vv,g=null;
function edge(x0,y0,x1,y1,s,P){
 const dx=x1-x0,dy=y1-y0,L=Math.hypot(dx,dy),nx=dy/L,ny=-dx/L;
 const q=(u,v)=>[x0+dx*u+nx*v*m*s,y0+dy*u+ny*v*m*s];
 if(!s){P.lineTo(x1,y1);return}
 P.lineTo(...q(.4,0));
 P.bezierCurveTo(...q(.4,.08),...q(.34,.1),...q(.34,.18));
 P.bezierCurveTo(...q(.34,.28),...q(.66,.28),...q(.66,.18));
 P.bezierCurveTo(...q(.66,.1),...q(.6,.08),...q(.6,0));
 P.lineTo(x1,y1);
}
function path(r,c){
 const P=new Path2D,x0=pad,y0=pad,x1=pad+pw,y1=pad+ph;P.moveTo(x0,y0);
 edge(x0,y0,x1,y0,r?-Hh[r][c]:0,P);
 edge(x1,y0,x1,y1,c<C-1?Vv[r][c+1]:0,P);
 edge(x1,y1,x0,y1,r<R-1?Hh[r+1][c]:0,P);
 edge(x0,y1,x0,y0,c?-Vv[r][c]:0,P);
 P.closePath();return P;
}
function mk(r,c){
 const W=pw+2*pad,H=ph+2*pad,d=Math.min(window.devicePixelRatio||1,2);
 const cv=document.createElement('canvas');cv.width=W*d;cv.height=H*d;cv.style.width=W+'px';cv.style.height=H+'px';
 const x=cv.getContext('2d');x.scale(d,d);
 const P=path(r,c);x.save();x.clip(P);
 x.drawImage(IMG,-(c*pw-pad),-(r*ph-pad),bw,bh);x.restore();
 x.lineWidth=1.2;x.strokeStyle='rgba(255,255,255,.55)';x.stroke(P);
 const el=document.createElement('div');el.className='p';el.dataset.r=r;el.dataset.c=c;el.appendChild(cv);return el;
}
function cnt(){$('cnt').textContent=placed+'/'+C*R}
function drawGuide(){
 const d=Math.min(window.devicePixelRatio||1,2),cv=document.createElement('canvas');
 cv.id='guide';cv.width=bw*d;cv.height=bh*d;cv.style.cssText='position:absolute;left:0;top:0;width:'+bw+'px;height:'+bh+'px;pointer-events:none';
 const x=cv.getContext('2d'),cs=getComputedStyle(document.documentElement);
 x.scale(d,d);x.strokeStyle=cs.getPropertyValue('--line');x.fillStyle=cs.getPropertyValue('--cell');x.lineWidth=1.5;
 for(let r=0;r<R;r++)for(let c=0;c<C;c++){x.save();x.translate(c*pw-pad,r*ph-pad);const P=path(r,c);x.fill(P);x.stroke(P);x.restore()}
 board.prepend(cv);
}
function build(){
 [C,R]=$('lv').value.split('x').map(Number);
 const wr=$('wrap');
 bw=Math.floor(Math.min(wr.clientWidth-12,(wr.clientHeight-12)*9/16));bh=Math.floor(bw*16/9);
 pw=bw/C;ph=bh/R;m=Math.min(pw,ph);pad=Math.ceil(m*.27)+2;
 board.style.width=bw+'px';board.style.height=bh+'px';
 board.querySelectorAll('.p,#guide').forEach(e=>e.remove());tray.innerHTML='';placed=0;win.style.display='none';
 const rnd=()=>Math.random()<.5?1:-1;
 Hh=[...Array(R+1)].map(()=>[...Array(C)].map(rnd));
 Vv=[...Array(R)].map(()=>[...Array(C+1)].map(rnd));drawGuide();
 const W=pw+2*pad,H=ph+2*pad,k=Math.min(.85,(tray.clientHeight-14)/H);
 const list=[];for(let r=0;r<R;r++)for(let c=0;c<C;c++)list.push([r,c]);
 for(let i=list.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[list[i],list[j]]=[list[j],list[i]]}
 list.forEach(([r,c])=>{
  const el=mk(r,c);el.style.setProperty('--k',k);
  const sl=document.createElement('div');sl.className='slot';sl.style.width=W*k+'px';sl.style.height=H*k+'px';
  sl.appendChild(el);tray.appendChild(sl);
 });
 tray.scrollLeft=0;cnt();
}
tray.addEventListener('pointerdown',e=>{
 const el=e.target.closest('.p');if(!el||el.classList.contains('ok'))return;
 g={el,sx:e.clientX,sy:e.clientY,mode:0,sl:tray.scrollLeft};
});
window.addEventListener('pointermove',e=>{
 if(!g)return;
 const dx=e.clientX-g.sx,dy=e.clientY-g.sy;
 if(!g.mode){
  if(Math.hypot(dx,dy)<8)return;
  g.mode=(e.pointerType!=='mouse'&&Math.abs(dx)>Math.abs(dy))?'scroll':'drag';
  if(g.mode==='drag')g.el.classList.add('drag');
 }
 if(g.mode==='scroll'){tray.scrollLeft=g.sl-dx;return}
 const W=pw+2*pad,H=ph+2*pad;
 g.el.style.left=(e.clientX-W/2)+'px';g.el.style.top=(e.clientY-H/2-50)+'px';
});
function end(){
 if(!g)return;const el=g.el,mode=g.mode;g=null;
 if(mode!=='drag')return;
 const r=+el.dataset.r,c=+el.dataset.c,br=board.getBoundingClientRect();
 const tx=br.left+c*pw-pad,ty=br.top+r*ph-pad,x=parseFloat(el.style.left),y=parseFloat(el.style.top);
 if(Math.hypot(x-tx,y-ty)<m*.45){
  const sl=el.parentNode;
  el.classList.remove('drag');el.classList.add('ok');
  el.style.left=(c*pw-pad)+'px';el.style.top=(r*ph-pad)+'px';
  board.appendChild(el);sl.remove();
  placed++;cnt();
  if(placed===C*R)setTimeout(()=>win.style.display='flex',300);
 }else{
  el.classList.remove('drag');el.style.left='';el.style.top='';
 }
}
window.addEventListener('pointerup',end);
window.addEventListener('pointercancel',end);
$('again').onclick=build;$('lv').onchange=build;
$('hint').onclick=()=>{ghost.style.display='block';setTimeout(()=>ghost.style.display='none',1600)};
IMG.onload=()=>{ghost.style.backgroundImage='url('+SRC+')';build()};
IMG.src=SRC;
</script></body></html>
